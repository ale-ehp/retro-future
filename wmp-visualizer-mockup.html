<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>WMP9 Metallic Tunnel Visualizer</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #edf7ff;
      --muted: rgba(226, 241, 255, 0.7);
      --edge: rgba(139, 203, 255, 0.38);
      --panel: rgba(5, 10, 17, 0.82);
      --blue: #236fe6;
      --cyan: #5fe8ff;
      --magenta: #f04dff;
      --lime: #b9ff28;
      --amber: #ffb032;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      overflow: hidden;
      background: #010306;
      color: var(--ink);
      font: 13px/1.45 "Segoe UI", Tahoma, system-ui, sans-serif;
    }

    .stage {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 46%, rgba(22, 32, 54, 0.75), rgba(1, 3, 6, 0.96) 62%),
        #010306;
    }

    canvas {
      width: min(100vw, calc(100vh * 1.333));
      height: min(100vh, calc(100vw * 0.75));
      display: block;
      background: #000205;
      image-rendering: auto;
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.07),
        0 0 90px rgba(69, 184, 255, 0.18);
    }

    .stage::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(rgba(255, 255, 255, 0.035) 50%, rgba(0, 0, 0, 0.055) 50%),
        radial-gradient(circle at 50% 50%, transparent 0 58%, rgba(0, 0, 0, 0.56) 100%);
      background-size: 100% 3px, auto;
      mix-blend-mode: screen;
      opacity: 0.62;
    }

    .hud {
      position: fixed;
      left: 16px;
      right: 16px;
      bottom: 14px;
      z-index: 2;
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 12px;
      pointer-events: none;
    }

    .panel,
    .badge {
      pointer-events: auto;
      border: 1px solid var(--edge);
      background:
        linear-gradient(180deg, rgba(18, 28, 42, 0.88), rgba(4, 8, 14, 0.82)),
        var(--panel);
      box-shadow:
        0 16px 42px rgba(0, 0, 0, 0.42),
        0 0 0 1px rgba(255, 255, 255, 0.045) inset;
    }

    .badge {
      min-width: 230px;
      padding: 10px 12px;
    }

    .badge strong {
      display: block;
      font-size: 16px;
      line-height: 1.1;
      letter-spacing: 0;
    }

    .badge span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
    }

    .panel {
      width: min(720px, calc(100vw - 32px));
      padding: 10px;
      display: grid;
      grid-template-columns: auto minmax(120px, 1fr) minmax(120px, 1fr) minmax(120px, 1fr) minmax(110px, 0.8fr);
      gap: 10px;
      align-items: end;
    }

    button,
    select,
    input {
      font: inherit;
    }

    button {
      min-height: 34px;
      padding: 0 14px;
      border: 1px solid rgba(145, 218, 255, 0.55);
      background:
        linear-gradient(180deg, rgba(180, 238, 255, 0.2), rgba(34, 95, 165, 0.34) 48%, rgba(7, 18, 34, 0.7));
      color: var(--ink);
      cursor: pointer;
      text-shadow: 0 1px 1px rgba(0, 0, 0, 0.8);
    }

    label {
      display: grid;
      gap: 5px;
      min-width: 0;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    select {
      min-height: 34px;
      width: 100%;
      border: 1px solid rgba(145, 218, 255, 0.45);
      background: #07111f;
      color: var(--ink);
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--cyan);
    }

    @media (max-width: 820px) {
      .hud {
        align-items: stretch;
        flex-direction: column;
      }

      .panel {
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="stage">
    <canvas id="visualizer" width="960" height="720" aria-label="Windows Media Player 9 metallic tunnel visualizer"></canvas>
  </main>

  <div class="hud">
    <div class="badge">
      <strong>avstudio.ai</strong>
      <span id="status">WMP9 metallic tunnel, procedural until audio starts</span>
    </div>

    <form class="panel" id="controls">
      <button type="button" id="play">Play</button>
      <label>
        Effect
        <select id="effect">
          <option value="tunnel">Metal Tunnel</option>
          <option value="swirl">Magenta Swirl</option>
          <option value="orb">Cyan Energy Orb</option>
          <option value="spectrum">Chrome Spectrum</option>
          <option value="plasma">Fire Plasma Bowl</option>
        </select>
      </label>
      <label>
        Metallic
        <input id="metal" type="range" min="0.2" max="2.4" step="0.01" value="1.55">
      </label>
      <label>
        Tunnel
        <input id="depth" type="range" min="0.35" max="2.5" step="0.01" value="1.9">
      </label>
      <label>
        Volume
        <input id="volume" type="range" min="0" max="1" step="0.01" value="0.8">
      </label>
    </form>
  </div>

  <audio id="track" loop preload="metadata" src="audio/music/retro-future.opus"></audio>

  <script>
    (() => {
      const canvas = document.getElementById('visualizer');
      const ctx = canvas.getContext('2d', { alpha: false });
      const audio = document.getElementById('track');
      const playButton = document.getElementById('play');
      const status = document.getElementById('status');
      const effectInput = document.getElementById('effect');
      const metalInput = document.getElementById('metal');
      const depthInput = document.getElementById('depth');
      const volumeInput = document.getElementById('volume');

      const palette = [
        '#f04dff', '#792dff', '#2a64ff', '#56ecff', '#58ff97',
        '#d9ff38', '#ffb02a', '#ff3838', '#f4f6ff', '#98a7ff'
      ];

      const firePalette = ['#230002', '#7a0509', '#ff2f12', '#ffb21f', '#fff06a', '#302bff'];
      let audioContext = null;
      let analyser = null;
      let gain = null;
      let source = null;
      let freq = null;
      let wave = null;
      let audioLive = false;
      let last = performance.now();
      let phase = 0;
      let spectrumPeaks = Array.from({ length: 96 }, () => 0);

      const state = {
        effect: effectInput.value,
        metal: Number(metalInput.value),
        depth: Number(depthInput.value),
        volume: Number(volumeInput.value)
      };

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function setupAudio() {
        if (audioContext) return;
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioContext.createAnalyser();
        analyser.fftSize = 2048;
        analyser.smoothingTimeConstant = 0.74;
        gain = audioContext.createGain();
        gain.gain.value = state.volume;
        source = audioContext.createMediaElementSource(audio);
        source.connect(analyser);
        analyser.connect(gain);
        gain.connect(audioContext.destination);
        freq = new Uint8Array(analyser.frequencyBinCount);
        wave = new Uint8Array(analyser.frequencyBinCount);
      }

      async function playAudio() {
        setupAudio();
        if (audioContext.state === 'suspended') await audioContext.resume();
        await audio.play();
        audioLive = true;
        playButton.textContent = 'Pause';
        status.textContent = 'Audio analyser active';
      }

      playButton.addEventListener('click', () => {
        if (!audio.paused) {
          audio.pause();
          audioLive = false;
          playButton.textContent = 'Play';
          status.textContent = 'Paused, procedural motion still active';
          return;
        }
        playAudio().catch(() => {
          audioLive = false;
          status.textContent = 'Audio blocked, procedural mode';
        });
      });

      effectInput.addEventListener('input', () => { state.effect = effectInput.value; });
      metalInput.addEventListener('input', () => { state.metal = Number(metalInput.value); });
      depthInput.addEventListener('input', () => { state.depth = Number(depthInput.value); });
      volumeInput.addEventListener('input', () => {
        state.volume = Number(volumeInput.value);
        if (gain) gain.gain.value = state.volume;
      });

      function procedural(index, time, speed) {
        const a = Math.sin(time * 0.0013 * speed + index * 0.27);
        const b = Math.sin(time * 0.0007 * speed + index * 0.043);
        const c = Math.sin(time * 0.0021 * speed + index * 0.019);
        return clamp(0.44 + a * 0.24 + b * 0.2 + c * 0.12, 0, 1);
      }

      function sampleAudio(time) {
        if (audioLive && analyser) {
          analyser.getByteFrequencyData(freq);
          analyser.getByteTimeDomainData(wave);
          return;
        }

        if (!freq) {
          freq = new Uint8Array(1024);
          wave = new Uint8Array(1024);
        }
        for (let i = 0; i < freq.length; i += 1) {
          freq[i] = Math.round(procedural(i, time, 1) * 255);
          wave[i] = 128 + Math.round(Math.sin(time * 0.002 + i * 0.047) * 70);
        }
      }

      function band(index, count, curve = 1.35) {
        const t = Math.pow(index / Math.max(1, count - 1), curve);
        return freq[Math.min(freq.length - 1, Math.round(t * (freq.length - 1)))] / 255;
      }

      function avg(start, end) {
        const a = Math.max(0, Math.floor(start * freq.length));
        const b = Math.min(freq.length - 1, Math.ceil(end * freq.length));
        let sum = 0;
        let count = 0;
        for (let i = a; i <= b; i += 1) {
          sum += freq[i];
          count += 1;
        }
        return count ? sum / (count * 255) : 0;
      }

      function waveAt(index) {
        return ((wave[index % wave.length] || 128) - 128) / 128;
      }

      function clear(alpha) {
        ctx.globalCompositeOperation = 'source-over';
        ctx.fillStyle = `rgba(0, 2, 5, ${alpha})`;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      function metallicStroke(color, width, blur, alpha) {
        ctx.strokeStyle = color;
        ctx.lineWidth = width;
        ctx.globalAlpha = alpha;
        ctx.shadowColor = color;
        ctx.shadowBlur = blur * state.metal;
      }

      function metallicFillGradient(x0, y0, x1, y1, colors, alpha = 1) {
        const g = ctx.createLinearGradient(x0, y0, x1, y1);
        g.addColorStop(0, colors[0]);
        g.addColorStop(0.22, colors[1]);
        g.addColorStop(0.48, '#f4f7ff');
        g.addColorStop(0.58, colors[2]);
        g.addColorStop(1, colors[3]);
        ctx.globalAlpha = alpha;
        ctx.fillStyle = g;
      }

      function drawTunnel(time, energy, bass) {
        const w = canvas.width;
        const h = canvas.height;
        const cx = w * 0.5;
        const cy = h * 0.52;
        const rings = 46;
        const spokes = 28;
        const twist = phase * (0.56 + bass * 1.8);

        ctx.save();
        ctx.translate(cx, cy);
        ctx.globalCompositeOperation = 'lighter';

        for (let r = rings; r >= 1; r -= 1) {
          const t = r / rings;
          const z = Math.pow(t, 1.8);
          const radius = 18 + z * Math.min(w, h) * (0.72 + state.depth * 0.18);
          const wobble = Math.sin(time * 0.002 + r * 0.45) * 0.04 + waveAt(r * 11) * 0.055;
          const sides = 72;
          const colorA = palette[(r + Math.floor(phase * 4)) % palette.length];
          const colorB = palette[(r + 4) % palette.length];
          ctx.beginPath();
          for (let i = 0; i <= sides; i += 1) {
            const p = i / sides;
            const a = p * Math.PI * 2 + twist * (1 - t) * state.depth + Math.sin(p * 12 + phase + r) * wobble;
            const br = 1 + Math.sin(a * 3 + time * 0.0018 + r) * 0.07 + band((i + r) % 96, 96) * 0.08;
            const x = Math.cos(a) * radius * br;
            const y = Math.sin(a) * radius * br * 0.72;
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          }
          const g = ctx.createLinearGradient(-radius, -radius * 0.55, radius, radius * 0.55);
          g.addColorStop(0, colorA);
          g.addColorStop(0.42, '#f5f8ff');
          g.addColorStop(0.5, colorB);
          g.addColorStop(0.82, '#111827');
          g.addColorStop(1, palette[(r + 7) % palette.length]);
          ctx.strokeStyle = g;
          ctx.lineWidth = 1.1 + (1 - t) * 7.5 + energy * 5;
          ctx.globalAlpha = 0.045 + (1 - t) * 0.26 + energy * 0.12;
          ctx.shadowColor = colorB;
          ctx.shadowBlur = (4 + (1 - t) * 26) * state.metal;
          ctx.stroke();
        }

        for (let s = 0; s < spokes; s += 1) {
          const value = band(s, spokes, 1.2);
          const a = (s / spokes) * Math.PI * 2 + twist * 0.24 + value * 0.55;
          const len = Math.min(w, h) * (0.18 + value * 0.72) * state.depth;
          ctx.beginPath();
          ctx.moveTo(Math.cos(a) * 20, Math.sin(a) * 14);
          ctx.lineTo(Math.cos(a) * len, Math.sin(a) * len * 0.72);
          metallicStroke(palette[(s * 2) % palette.length], 1.4 + value * 5, 12 + value * 34, 0.14 + value * 0.28);
          ctx.stroke();
        }

        const core = ctx.createRadialGradient(0, 0, 0, 0, 0, 180 + bass * 120);
        core.addColorStop(0, `rgba(245, 248, 255, ${0.8 + energy * 0.18})`);
        core.addColorStop(0.12, `rgba(95, 232, 255, ${0.42 + bass * 0.25})`);
        core.addColorStop(0.38, `rgba(240, 77, 255, ${0.18 + energy * 0.18})`);
        core.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.globalAlpha = 1;
        ctx.fillStyle = core;
        ctx.fillRect(-260, -260, 520, 520);
        ctx.restore();
      }

      function drawSwirl(time, energy, bass) {
        const w = canvas.width;
        const h = canvas.height;
        const cx = w * 0.5;
        const cy = h * 0.5;
        ctx.save();
        ctx.translate(cx, cy);
        ctx.globalCompositeOperation = 'lighter';
        for (let arm = 0; arm < 8; arm += 1) {
          ctx.beginPath();
          for (let i = 0; i < 150; i += 1) {
            const t = i / 149;
            const a = arm * Math.PI * 0.25 + t * (4.2 + bass * 2.4) + phase * 1.6;
            const r = t * Math.min(w, h) * 0.58;
            const x = Math.cos(a) * r;
            const y = Math.sin(a) * r * 0.78;
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          }
          metallicStroke(arm % 2 ? '#f04dff' : '#9b38ff', 7 + energy * 10, 22, 0.22 + energy * 0.24);
          ctx.stroke();
        }
        ctx.restore();
      }

      function drawOrb(time, energy, bass) {
        const w = canvas.width;
        const h = canvas.height;
        const cx = w * 0.5;
        const cy = h * 0.5;
        ctx.save();
        ctx.translate(cx, cy);
        ctx.globalCompositeOperation = 'lighter';
        for (let ring = 0; ring < 26; ring += 1) {
          ctx.beginPath();
          const r = 28 + ring * 10 + bass * 80;
          for (let i = 0; i <= 160; i += 1) {
            const a = (i / 160) * Math.PI * 2;
            const v = band((ring * 9 + i) % 140, 140);
            const rr = r + Math.sin(a * 4 + phase * 2 + ring) * 9 + v * 34 * state.metal;
            const x = Math.cos(a) * rr;
            const y = Math.sin(a) * rr * 0.82;
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          }
          metallicStroke(ring % 3 === 0 ? '#5fe8ff' : ring % 3 === 1 ? '#f4f6ff' : '#58ff97', 1.2 + ring * 0.04, 18, 0.05 + energy * 0.12);
          ctx.stroke();
        }
        ctx.restore();
      }

      function drawSpectrum(time, energy) {
        const w = canvas.width;
        const h = canvas.height;
        const count = 96;
        const base = h * 0.82;
        const gap = 2;
        const bw = (w - 80 - gap * (count - 1)) / count;
        ctx.globalCompositeOperation = 'lighter';
        for (let i = 0; i < count; i += 1) {
          const v = Math.pow(band(i, count, 1.6) * state.depth, 0.78);
          const x = 40 + i * (bw + gap);
          const bh = Math.max(3, v * h * 0.64);
          const y = base - bh;
          metallicFillGradient(x, y, x + bw, base, ['#102dff', palette[i % palette.length], '#fff7c8', '#051017'], 0.95);
          ctx.fillRect(x, y, bw, bh);
          spectrumPeaks[i] = Math.min(spectrumPeaks[i] || base, y - 6);
          spectrumPeaks[i] += 1.5 + (1 - v) * 5;
          spectrumPeaks[i] = Math.min(spectrumPeaks[i], base - 7);
          ctx.fillStyle = '#f5f8ff';
          ctx.globalAlpha = 0.42;
          ctx.fillRect(x, spectrumPeaks[i], bw, 3);
        }
      }

      function drawPlasma(time, energy, bass) {
        const w = canvas.width;
        const h = canvas.height;
        const cx = w * 0.5;
        const cy = h * 0.76;
        ctx.save();
        ctx.translate(cx, cy);
        ctx.globalCompositeOperation = 'lighter';
        for (let flame = 0; flame < 120; flame += 1) {
          const t = flame / 119;
          const a = (t - 0.5) * Math.PI * 1.35;
          const v = band(flame, 120, 1.25);
          const height = h * (0.22 + v * 0.42 + bass * 0.2);
          ctx.beginPath();
          ctx.moveTo(Math.cos(a) * 40, Math.sin(a) * 10);
          ctx.bezierCurveTo(
            Math.cos(a) * 120, -height * 0.2,
            Math.cos(a + Math.sin(phase + flame) * 0.2) * 180, -height * 0.72,
            Math.cos(a) * 30, -height
          );
          metallicStroke(firePalette[flame % firePalette.length], 2 + v * 8, 18 + v * 35, 0.1 + v * 0.32);
          ctx.stroke();
        }
        ctx.restore();
      }

      function drawVignette() {
        const w = canvas.width;
        const h = canvas.height;
        const g = ctx.createRadialGradient(w * 0.5, h * 0.5, h * 0.12, w * 0.5, h * 0.5, h * 0.74);
        g.addColorStop(0, 'rgba(0,0,0,0)');
        g.addColorStop(1, 'rgba(0,0,0,0.7)');
        ctx.globalCompositeOperation = 'source-over';
        ctx.globalAlpha = 1;
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, w, h);
      }

      function frame(now) {
        const dt = Math.min(50, now - last);
        last = now;
        phase += dt * 0.001;
        sampleAudio(now);
        const bass = avg(0.02, 0.16);
        const mids = avg(0.16, 0.54);
        const highs = avg(0.54, 0.98);
        const energy = clamp((bass * 0.48 + mids * 0.34 + highs * 0.18) * state.depth, 0, 1);

        clear(state.effect === 'tunnel' ? 0.16 : 0.2);
        if (state.effect === 'swirl') drawSwirl(now, energy, bass);
        else if (state.effect === 'orb') drawOrb(now, energy, bass);
        else if (state.effect === 'spectrum') drawSpectrum(now, energy);
        else if (state.effect === 'plasma') drawPlasma(now, energy, bass);
        else drawTunnel(now, energy, bass);
        drawVignette();
        requestAnimationFrame(frame);
      }

      ctx.fillStyle = '#000205';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
